<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* ===== FLOATING SHAPES ===== */

:root {
  --primary: #A2CB8B;
  --primary-dark: #8FB779;
  --primary-light: #EBCC8A;
  --secondary: #EBCC8A;
  --accent: #2d3436;
  --dark: #000000;
  --dark-light: #444444;
  --light: #ffffff;
  --white: #ffffff;
  --gradient: linear-gradient(135deg, #A2CB8B 0%, #EBCC8A 100%);
  --gradient-warm: linear-gradient(135deg, #EBCC8A 0%, #A2CB8B 100%);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Minimal black shadow */
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}



/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes fadeInRight {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.animate-fade-up {
  opacity: 0;
  animation: fadeInUp 0.8s ease forwards;
}

.animate-fade-left {
  opacity: 0;
  animation: fadeInLeft 0.8s ease forwards;
}

.animate-fade-right {
  opacity: 0;
  animation: fadeInRight 0.8s ease forwards;
}

.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }

/* ===== FLOATING SHAPES ===== */
.floating-shapes {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.floating-shapes .shape {
  position: absolute;
  border-radius: 50%;
  opacity: 0.1;
}

.floating-shapes .shape-1 {
  width: 300px;
  height: 300px;
  background: var(--primary);
  top: -100px;
  right: -50px;
  animation: float 6s ease-in-out infinite;
}

.floating-shapes .shape-2 {
  width: 200px;
  height: 200px;
  background: var(--secondary);
  bottom: -50px;
  left: -50px;
  animation: float 8s ease-in-out infinite reverse;
}

.floating-shapes .shape-3 {
  width: 150px;
  height: 150px;
  background: var(--accent);
  top: 50%;
  left: 50%;
  animation: float 7s ease-in-out infinite;
}



/* ===== RESPONSIVE ===== */

.capsule-3d {
  position: relative;
  width: 350px;
  height: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.capsule-body {
  position: relative;
  width: 180px;
  height: 180px;
  background: var(--gradient);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); /* Black shadow */
  animation: pulse 3s ease-in-out infinite;
}

.capsule-icon {
  font-size: 4rem;
  color: white;
  z-index: 2;
}

.capsule-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--gradient);
  filter: blur(40px);
  opacity: 0.3;
}

.capsule-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(0, 0, 0, 0.1); /* Subtle black border */
}

.ring-1 {
  width: 230px;
  height: 230px;
  animation: pulse 4s ease-in-out infinite;
}

.ring-2 {
  width: 280px;
  height: 280px;
  animation: pulse 5s ease-in-out infinite reverse;
}

.ring-3 {
  width: 330px;
  height: 330px;
  animation: pulse 6s ease-in-out infinite;
}

.floating-item {
  position: absolute;
  width: 55px;
  height: 55px;
  background: white;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  color: var(--primary);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  animation: float 4s ease-in-out infinite;
}

.item-1 { top: 20px; right: 40px; animation-delay: 0s; }
.item-2 { bottom: 40px; right: 20px; animation-delay: 1s; }
.item-3 { top: 40px; left: 20px; animation-delay: 2s; }
.item-4 { bottom: 20px; left: 40px; animation-delay: 3s; }

    </style>
</head>
<body>
    
</body>
</html>
<div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
</div>
    <div class="col-lg-6 animate-fade-right delay-2">
          <div class="hero-illustration">
            <div class="capsule-3d">
              <div class="capsule-body">
                <div class="capsule-icon">
                  <i class="bi bi-hourglass-split"></i>
                </div>
                <div class="capsule-glow"></div>
                <div class="capsule-ring ring-1"></div>
                <div class="capsule-ring ring-2"></div>
                <div class="capsule-ring ring-3"></div>
              </div>
              <div class="floating-item item-1">
                <i class="bi bi-image"></i>
              </div>
              <div class="floating-item item-2">
                <i class="bi bi-chat-heart"></i>
              </div>
              <div class="floating-item item-3">
                <i class="bi bi-lock-fill"></i>
              </div>
              <div class="floating-item item-4">
                <i class="bi bi-people-fill"></i>
              </div>
            </div>
          </div>
        </div>
</body>
</html>
